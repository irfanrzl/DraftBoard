<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Draftboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --ink: #17161c; --muted: #6b7280; --line: #e7e5e4;
    --paper: #faf9f7; --card: #fff; --accent: #4338ca; --accent-soft: #eef2ff;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--paper); height: 100vh; overflow: hidden;
  }
  header {
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; gap: 12px;
  }
  header .logo { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
  header .tag { font-size: 13px; color: var(--muted); }
  .layout { display: flex; height: calc(100vh - 53px); }

  .panel {
    width: 420px; flex-shrink: 0; border-right: 1px solid var(--line);
    background: var(--card); padding: 20px; overflow-y: auto; display: flex; flex-direction: column;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #f3f4f6; padding: 4px; border-radius: 10px; }
  .tab {
    flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 7px;
    font-size: 14px; font-family: inherit; cursor: pointer; color: var(--muted);
  }
  .tab.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  textarea {
    width: 100%; flex: 1; min-height: 280px; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    resize: none; background: #fcfcfb;
  }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  .drop {
    flex: 1; min-height: 280px; border: 2px dashed var(--line); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); cursor: pointer; gap: 8px; padding: 20px;
  }
  .drop.hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop img { max-width: 100%; max-height: 220px; border-radius: 8px; }
  .drop .hint { font-size: 13px; }

  .hidden { display: none; }

  .row { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  select {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    font-family: inherit; background: var(--card);
  }
  button.primary {
    flex: 1; border: 0; background: var(--accent); color: #fff; padding: 11px;
    border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button.primary:hover { background: #3730a3; }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.ghost {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 11px 16px; border-radius: 9px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button.ghost:hover { background: #f9fafb; }
  button.ghost:disabled { opacity: 0.5; cursor: default; }

  .examples { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .examples a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .examples a:hover { text-decoration: underline; }

  .error { margin-top: 12px; color: var(--danger); font-size: 13px; white-space: pre-wrap; }

  .preview { flex: 1; display: flex; flex-direction: column; background: var(--paper); }
  .preview .bar {
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted);
  }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .placeholder {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #b8b5b0; font-size: 15px; text-align: center; padding: 40px;
  }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--accent-soft); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <span class="logo">Draftboard</span>
  <span class="tag">diagram → dashboard</span>
</header>

<div class="layout">
  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-mode="text" onclick="setMode('text')">Paste text</button>
      <button class="tab" data-mode="image" onclick="setMode('image')">Upload screenshot</button>
    </div>

    <textarea id="text" placeholder="Paste your DBML or Mermaid ERD here..."></textarea>

    <div id="drop" class="drop hidden">
      <div class="hint">Click or drop an ERD screenshot here</div>
      <div class="hint" style="font-size:12px">PNG, JPG — needs Ollama running</div>
      <input id="file" type="file" accept="image/*" class="hidden" />
    </div>

    <div class="examples" id="examples">
      Try an example:
      <a onclick="loadExample('dbml')">DBML</a> ·
      <a onclick="loadExample('mermaid')">Mermaid</a>
    </div>

    <div class="row">
      <select id="format">
        <option value="auto">Auto-detect</option>
        <option value="dbml">DBML</option>
        <option value="mermaid">Mermaid</option>
      </select>
      <button class="primary" id="gen" onclick="generate()">Generate</button>
    </div>

    <div class="error" id="error"></div>
  </div>

  <div class="preview">
    <div class="bar">
      <span id="status">No dashboard yet</span>
      <button class="ghost" id="download" onclick="download()" disabled>Download project</button>
    </div>
    <div class="placeholder" id="placeholder">
      Paste a diagram or upload a screenshot, then click Generate.<br />
      Your dashboard preview appears here.
    </div>
    <iframe id="frame" class="hidden"></iframe>
  </div>
</div>

<script>
  let mode = "text";
  let imageBase64 = null;
  let imageMedia = null;
  let currentSpec = null;

  const EXAMPLES = {
    dbml: `Table User {
  id uuid [pk]
  email varchar [unique, not null]
  name varchar
  status varchar
  created_at timestamp
}
Table Post {
  id uuid [pk]
  title varchar [not null]
  body text
  user_id uuid [ref: > User.id]
  created_at timestamp
}`,
    mermaid: `erDiagram
    USER ||--o{ POST : writes
    USER {
        uuid id PK
        string email
        string name
        string status
        datetime created_at
    }
    POST {
        uuid id PK
        uuid user_id FK
        string title
        text body
        datetime created_at
    }`
  };

  function setMode(m) {
    mode = m;
    document.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("active", t.dataset.mode === m));
    document.getElementById("text").classList.toggle("hidden", m !== "text");
    document.getElementById("drop").classList.toggle("hidden", m !== "image");
    document.getElementById("examples").classList.toggle("hidden", m !== "text");
    document.getElementById("format").style.display = m === "text" ? "" : "none";
  }

  function loadExample(kind) {
    document.getElementById("text").value = EXAMPLES[kind];
    document.getElementById("format").value = kind;
  }

  // image upload wiring
  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("file");
  drop.onclick = () => fileInput.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("hover"); };
  drop.ondragleave = () => drop.classList.remove("hover");
  drop.ondrop = (e) => {
    e.preventDefault(); drop.classList.remove("hover");
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  };
  fileInput.onchange = () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); };

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      imageBase64 = reader.result.split(",")[1];
      imageMedia = file.type || "image/png";
      drop.innerHTML = '<img src="' + reader.result + '" alt="preview" />';
    };
    reader.readAsDataURL(file);
  }

  function setError(msg) {
    document.getElementById("error").textContent = msg || "";
  }

  async function generate() {
    setError("");
    const gen = document.getElementById("gen");
    const status = document.getElementById("status");
    gen.disabled = true;
    status.innerHTML = '<span class="spinner"></span> Generating...';

    let payload;
    if (mode === "text") {
      const text = document.getElementById("text").value.trim();
      if (!text) { setError("Paste a diagram first."); reset(); return; }
      payload = { kind: document.getElementById("format").value, text };
    } else {
      if (!imageBase64) { setError("Upload a screenshot first."); reset(); return; }
      status.innerHTML = '<span class="spinner"></span> Reading image (can take a moment)...';
      payload = { kind: "image", imageBase64, mediaType: imageMedia };
    }

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "Generation failed");

      currentSpec = data.spec;
      const frame = document.getElementById("frame");
      document.getElementById("placeholder").classList.add("hidden");
      frame.classList.remove("hidden");
      frame.srcdoc = data.html;

      const n = data.spec.entities.length;
      status.textContent = n + " " + (n === 1 ? "entity" : "entities") +
        ": " + data.spec.entities.map(e => e.name).join(", ");
      document.getElementById("download").disabled = false;
    } catch (err) {
      setError(err.message);
      status.textContent = "No dashboard yet";
    } finally {
      gen.disabled = false;
    }
  }

  function reset() {
    document.getElementById("gen").disabled = false;
    document.getElementById("status").textContent = "No dashboard yet";
  }

  async function download() {
    if (!currentSpec) return;
    const btn = document.getElementById("download");
    btn.disabled = true; btn.textContent = "Preparing...";
    try {
      const res = await fetch("/api/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spec: currentSpec }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const zip = new JSZip();
      for (const [path, contents] of Object.entries(data.files)) {
        zip.file(path, contents);
      }
      const blob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "dashboard-project.zip"; a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      setError(err.message);
    } finally {
      btn.disabled = false; btn.textContent = "Download project";
    }
  }

  // start on text mode with an example loaded
  loadExample("dbml");
</script>
</body>
</html>
